[versions]
agp = "8.9.1"
kotlin = "2.1.20"
composeBom = "2025.04.00"
wearCompose = "1.4.1"
activityCompose = "1.10.1"
lifecycle = "2.8.7"
playServicesWearable = "19.0.0"
serialization = "1.8.1"
coroutines = "1.10.2"
junit = "4.13.2"
